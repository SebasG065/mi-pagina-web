<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Publicar Artículo | Binario</title>
  <meta name="robots" content="noindex, follow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="site-header">
    <nav class="navbar">
      <a href="index.html" class="logo">Binario</a>
      <ul class="nav-links">
        <li><a href="index.html">Inicio</a></li>
        <li><a href="articulos.html">Artículos</a></li>
        <li><a href="publicar.html">Publicar</a></li>
      </ul>
      <button class="nav-toggle" id="navToggle" aria-label="Abrir menú">☰</button>
    </nav>
  </header>

  <main class="section">
    <h1>Publicar nuevo artículo</h1>
    <form class="contact-form" id="articleForm">
      <label for="title">Título</label>
      <input type="text" id="title" name="title" required>

      <label for="category">Categoría</label>
      <input type="text" id="category" name="category" placeholder="Ej: Inteligencia Artificial, Hardware, Software">

      <label for="author">Autor</label>
      <input type="text" id="author" name="author" placeholder="Tu nombre">

      <label for="imageUrl">URL de imagen (opcional)</label>
      <input type="url" id="imageUrl" name="imageUrl" placeholder="https://...">

      <label for="summary">Resumen breve</label>
      <textarea id="summary" name="summary" rows="2" required></textarea>

      <label for="content">Contenido</label>
      <textarea id="content" name="content" rows="10" required></textarea>

      <button type="submit" class="btn">Publicar artículo</button>
    </form>
    <p id="formStatus" class="form-status" hidden></p>
  </main>

  <footer class="site-footer">
    <p>&copy; <span id="year"></span> Binario. Todos los derechos reservados.</p>
  </footer>

  <script src="js/script.js"></script>
  <script src="js/publicar.js"></script>
</body>
</html>
